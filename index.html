<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Your Pocket Gym V2.2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;color:#111827}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.top{padding:22px 18px 12px;background:white;position:sticky;top:0;z-index:5;border-bottom:1px solid #e5e7eb}
h1{margin:0;font-size:24px}.subtitle{color:#6b7280;font-size:13px;margin-top:4px}.content{padding:16px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
.card h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px;background:#f8fafc;border-radius:12px}.stat b{font-size:22px;display:block}.muted{color:#6b7280;font-size:13px}
button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 14px;background:#111827;color:white;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;background:white}.foodrow,.workoutrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.empty{color:#6b7280;text-align:center;padding:18px}.tabs{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:center;z-index:10}.tabs button{flex:1;max-width:152px;background:white;color:#6b7280;border-radius:0;padding:10px 4px;font-size:12px}.tabs button.active{color:#111827;font-weight:750}.tabs span{display:block;font-size:18px}.coach{background:#111827;color:white}.coach .muted{color:#cbd5e1}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photoSlot{aspect-ratio:3/4;border:2px dashed #cbd5e1;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f8fafc;position:relative}.photoSlot img{width:100%;height:100%;object-fit:cover}.photoSlot label{font-size:12px;text-align:center;color:#64748b}.photoSlot input{position:absolute;inset:0;opacity:0;cursor:pointer}.notice{padding:10px;border-radius:10px;background:#ecfdf5;color:#065f46;font-size:13px;display:none}.small{font-size:12px}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>Your Pocket Gym</h1><div class="subtitle" id="welcome">Your personal fitness dashboard</div></header>
<main class="content" id="app"></main>
<nav class="tabs" id="tabs"></nav>
</div>
<script>
const KEY='pocketGymV22';
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2);
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{
 user:{id:uid(),name:'',weight:'',goal:'',coach:'Coach'},
 nutrition:{}, workouts:{}, progress:{}, profile:{}
};
data.user.id ||= uid();
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function day(){data.nutrition[today()] ||= {foods:[],calories:0,protein:0,carbs:0,fat:0};return data.nutrition[today()]}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
let tab='home';
function nav(){
const items=[['home','⌂','Home'],['workout','🏋','Workout'],['nutrition','🥗','Nutrition'],['progress','●','Progress'],['coach','🤖','Coach'],['profile','◉','Profile']];
tabs.innerHTML=items.map(x=>`<button class="${tab==x[0]?'active':''}" onclick="tab='${x[0]}';render()"><span>${x[1]}</span>${x[2]}</button>`).join('');
}
function render(){nav();welcome.textContent=data.user.name?`Welcome back, ${esc(data.user.name)}`:'Your personal fitness dashboard';app.innerHTML=views[tab]();}

const views={
home(){let d=day();let planned=Object.entries(data.workouts).filter(([k])=>k>=today()).slice(0,3);
return `<div class="card"><h2>Today</h2><div class="grid"><div class="stat"><b>${d.calories}</b><span class="muted">Calories</span></div><div class="stat"><b>${d.protein}g</b><span class="muted">Protein</span></div><div class="stat"><b>${planned.length}</b><span class="muted">Upcoming workouts</span></div><div class="stat"><b>${data.user.weight||'—'}</b><span class="muted">Current weight</span></div></div></div>
<div class="card"><h2>Quick actions</h2><div class="row"><button onclick="tab='nutrition';render()">Log food</button><button onclick="tab='workout';render()">Plan workout</button><button onclick="tab='progress';render()">Add progress photo</button></div></div>
<div class="card"><h2>Today’s workout</h2>${data.workouts[today()]?`<b>${esc(data.workouts[today()].name)}</b><p class="muted">${esc(data.workouts[today()].exercises||'')}</p>`:'<div class="empty">No workout planned for today.</div>'}</div>`},
nutrition(){let d=day();return `<div class="card"><h2>Nutrition — ${today()}</h2><div class="grid"><div class="stat"><b>${d.calories}</b><span class="muted">Calories</span></div><div class="stat"><b>${d.protein}g</b><span class="muted">Protein</span></div><div class="stat"><b>${d.carbs}g</b><span class="muted">Carbs</span></div><div class="stat"><b>${d.fat}g</b><span class="muted">Fat</span></div></div></div>
<div class="card"><h2>Add food</h2><div class="field"><label>Food</label><input id="food" placeholder="Chicken tacos"></div><div class="grid"><div class="field"><label>Calories</label><input id="cal" type="number" min="0"></div><div class="field"><label>Protein (g)</label><input id="pro" type="number" min="0"></div><div class="field"><label>Carbs (g)</label><input id="carb" type="number" min="0"></div><div class="field"><label>Fat (g)</label><input id="fat" type="number" min="0"></div></div><button onclick="addFood()">Add food</button></div>
<div class="card"><h2>Today’s foods</h2>${d.foods.length?d.foods.map((f,i)=>`<div class="foodrow"><span>${esc(f.name)}<br><span class="small muted">${f.cal} cal · ${f.pro}g protein</span></span><button class="danger" onclick="delFood(${i})">×</button></div>`).join(''):'<div class="empty">Nothing logged today.</div>'}</div>`},
workout(){return `<div class="card"><h2>Plan a workout</h2><div class="field"><label>Day</label><input id="wdate" type="date" value="${today()}"></div><div class="field"><label>Workout name</label><input id="wname" placeholder="Push Day"></div><div class="field"><label>Exercises</label><textarea id="wex" rows="5" placeholder="Bench press — 3 x 8&#10;Lat pulldown — 3 x 10"></textarea></div><div id="saved" class="notice">Workout saved successfully.</div><br><button onclick="saveWorkout()">Save Workout</button></div>
<div class="card"><h2>Scheduled workouts</h2>${Object.keys(data.workouts).sort().map(k=>`<div class="workoutrow"><span><b>${k}</b><br>${esc(data.workouts[k].name)}</span><div class="row"><button class="secondary" onclick="editWorkout('${k}')">Edit</button><button class="danger" onclick="deleteWorkout('${k}')">Delete</button></div></div>`).join('')||'<div class="empty">No workouts scheduled.</div>'}</div>`},
progress(){let p=data.progress;return `<div class="card"><h2>Progress</h2><div class="grid"><div class="stat"><b>${data.user.weight||'—'}</b><span class="muted">Current weight</span></div><div class="stat"><b>${Object.keys(data.workouts).length}</b><span class="muted">Planned workouts</span></div></div></div>
<div class="card"><h2>Progress Pictures</h2><p class="muted">Add separate front, side, and back photos.</p><div class="photoGrid">${['front','side','back'].map(x=>`<div><div class="photoSlot">${p[x]?`<img src="${p[x]}">`:`<label>${x.toUpperCase()}<br>Tap to add`}`}<input type="file" accept="image/*" onchange="photo(event,'${x}')"></div><div class="small muted" style="text-align:center;margin-top:5px">${x}</div></div>`).join('')}</div></div>`},
coach(){return `<div class="card coach"><h2>Meet ${esc(data.user.coach||'Coach')}</h2><p class="muted">Your personalized Pocket Gym coach.</p><div class="field"><label style="color:white">Coach name</label><input id="coachName" value="${esc(data.user.coach||'Coach')}" placeholder="Name your coach"></div><button onclick="setCoach()">Save coach name</button></div>
<div class="card"><h2>Coach snapshot</h2><p><b>Goal:</b> ${esc(data.user.goal)||'Set a goal in Profile'}</p><p><b>Weight:</b> ${esc(data.user.weight)||'Not entered'}</p><p><b>Workouts planned:</b> ${Object.keys(data.workouts).length}</p><p><b>Today’s calories:</b> ${day().calories}</p></div>`},
profile(){return `<div class="card"><h2>Profile</h2><div class="field"><label>Name</label><input id="pname" value="${esc(data.user.name)}"></div><div class="field"><label>Current weight</label><input id="pweight" value="${esc(data.user.weight)}" placeholder="lbs"></div><div class="field"><label>Goal</label><input id="pgoal" value="${esc(data.user.goal)}" placeholder="Build muscle, lose fat..."></div><button onclick="saveProfile()">Save Profile</button></div>
<div class="card"><h2>Your Pocket Gym account</h2><p class="muted">This browser keeps your Pocket Gym profile and fitness data separate from other browser/device profiles.</p><p class="small">User ID: ${esc(data.user.id)}</p></div>`}
};
function addFood(){let d=day(),f={name:food.value.trim()||'Food',cal:+cal.value||0,pro:+pro.value||0,carb:+carb.value||0,fat:+fat.value||0};d.foods.push(f);d.calories+=f.cal;d.protein+=f.pro;d.carbs+=f.carb;d.fat+=f.fat;save();render()}
function delFood(i){let d=day(),f=d.foods[i];d.calories-=f.cal;d.protein-=f.pro;d.carbs-=f.carb;d.fat-=f.fat;d.foods.splice(i,1);save();render()}
function saveWorkout(){let k=wdate.value;if(!k)return;data.workouts[k]={name:wname.value.trim()||'Workout',exercises:wex.value.trim()};save();render();setTimeout(()=>{let n=document.getElementById('saved');if(n)n.style.display='block'},0)}
function editWorkout(k){let w=data.workouts[k];tab='workout';render();setTimeout(()=>{wdate.value=k;wname.value=w.name;wex.value=w.exercises},0)}
function deleteWorkout(k){if(confirm('Delete this scheduled workout?')){delete data.workouts[k];save();render()}}
function photo(e,side){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{data.progress[side]=r.result;save();render()};r.readAsDataURL(file)}
function setCoach(){data.user.coach=coachName.value.trim()||'Coach';save();render()}
function saveProfile(){data.user.name=pname.value.trim();data.user.weight=pweight.value.trim();data.user.goal=pgoal.value.trim();save();render()}
render();
</script>
</body>
</html>
