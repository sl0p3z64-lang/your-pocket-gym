<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152b"><link rel="manifest" href="./manifest.json">
<title>Your Pocket Gym</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050b16;color:#eef5ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(#07152b,#050b16 42%);padding-bottom:92px}
header{padding:25px 17px 10px}.eyebrow{font-size:11px;letter-spacing:2px;color:#63a8ff;font-weight:800}.title{font-size:32px;font-weight:950;color:#f39b32;margin:3px 0}.muted{color:#91a4bd;font-size:13px}main{padding:0 15px}.screen{display:none}.screen.active{display:block}.card{background:#0b1830;border:1px solid #183153;border-radius:18px;padding:16px;margin:12px 0}.card h2{margin:0 0 11px;font-size:20px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#071225;border-radius:13px;padding:12px}.stat b{font-size:20px}.btn{border:0;border-radius:11px;padding:11px 13px;background:#1267d9;color:#fff;font-weight:800}.btn.orange{background:#e98421}.btn.alt{background:#182942}.btn.danger{background:#702b35}.input{width:100%;background:#071225;color:#fff;border:1px solid #254364;border-radius:10px;padding:11px}.form{display:grid;gap:9px}.avatar{width:62px;height:62px;border-radius:50%;object-fit:cover;background:#1267d9;display:grid;place-items:center;font-weight:900;font-size:20px;border:2px solid #347edb}.bar{height:9px;background:#071225;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#f39b32;border-radius:99px}.macro{display:grid;grid-template-columns:145px 1fr;gap:18px;align-items:center}.pie{width:140px;height:140px;border-radius:50%;position:relative}.pie:after{content:"";position:absolute;inset:27px;border-radius:50%;background:#0b1830}.legend div{display:flex;justify-content:space-between;margin:8px 0}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}.blue{background:#5da9ff}.orangeDot{background:#f39b32}.green{background:#6bd69a}.exercise{padding:11px;border:1px solid #1c3658;border-radius:13px;margin:8px 0;background:#071225}.remove{float:right;background:none;border:0;color:#f77;font-size:19px}.nav{position:fixed;bottom:0;left:0;right:0;background:#061124ee;backdrop-filter:blur(14px);border-top:1px solid #173050;display:flex;justify-content:center;z-index:5}.nav button{flex:1;max-width:126px;background:none;border:0;color:#7890ac;padding:10px 4px;font-size:10px}.nav button.active{color:#66aaff}.pill{padding:5px 9px;background:#12294a;border-radius:99px;color:#8fc2ff;font-size:12px}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photoSlot{aspect-ratio:3/4;border:2px dashed #315071;border-radius:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#071225;position:relative}.photoSlot img{width:100%;height:100%;object-fit:cover}.photoSlot label{font-size:11px;text-align:center;color:#91a4bd}.photoSlot input{position:absolute;inset:0;opacity:0;cursor:pointer}.notice{padding:10px;border-radius:10px;background:#103c2a;color:#8ee2b2;font-size:13px;display:none}.coachBubble{display:flex;gap:10px;align-items:flex-start}.coachAvatar{width:42px;height:42px;border-radius:50%;background:#1267d9;display:grid;place-items:center;font-weight:900;flex:none}.bubble{background:#12294a;border:1px solid #1c3658;border-radius:15px;padding:12px;line-height:1.45}.chatbox{display:flex;gap:8px}.chatbox .input{flex:1}.schedule{padding:10px 0;border-bottom:1px solid #183153}.schedule:last-child{border-bottom:0}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week button{padding:8px 2px;background:#071225;border:1px solid #254364;color:#91a4bd;border-radius:9px;font-size:10px}.week button.sel{background:#1267d9;color:#fff;border-color:#1267d9}.small{font-size:11px}.empty{text-align:center;padding:22px;color:#91a4bd}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:#07152b;width:100%;max-width:760px;margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto;border:1px solid #183153}
@media(max-width:520px){.macro{grid-template-columns:1fr}.pie{margin:auto}.nav button{max-width:120px}}
</style></head><body><div class="app">
<header><div class="eyebrow">YOUR POCKET GYM</div><div class="title">Your gym. Your program.</div><div id="greeting" class="muted"></div></header>
<main id="content"></main>
<nav class="nav" id="nav"></nav>
</div>
<script>
const ROOT="ypg_v22_users",ACTIVE="ypg_v22_active";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const uid=()=>{try{return crypto.randomUUID()}catch(e){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2)}};
const blank=()=>({id:uid(),profile:{name:"",age:"",height:"",weight:"",currentWeight:"",goalWeight:"",goal:"Lose fat",calTarget:"2200",pTarget:"160",cTarget:"250",fTarget:"75",photo:""},foods:[],workouts:[],custom:{},scheduled:{},weights:[],progress:{front:null,side:null,back:null},coach:{name:"Coach",chat:[]}});
function accounts(){try{return JSON.parse(localStorage.getItem(ROOT)||"{}")}catch(e){return{}}}
function saveAccounts(a){localStorage.setItem(ROOT,JSON.stringify(a))}
function load(){let a=accounts(),id=localStorage.getItem(ACTIVE);if(id&&a[id])return a[id];let d=blank();a[d.id]=d;saveAccounts(a);localStorage.setItem(ACTIVE,d.id);return d}
let d=load(),page="home",editDate=null;
function save(){let a=accounts();a[d.id]=d;saveAccounts(a);localStorage.setItem(ACTIVE,d.id)}
function greet(){let h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening"}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function initials(){return(d.profile.name||"YG").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function foods(){return d.foods.filter(x=>x.date===today())}
function macros(){return foods().reduce((a,x)=>(a.cal+=+x.cal||0,a.p+=+x.p||0,a.c+=+x.c||0,a.f+=+x.f||0,a),{cal:0,p:0,c:0,f:0})}
function go(x){page=x;render();scrollTo(0,0)}
function nav(){const items=[["home","⌂","Home"],["workout","🏋","Workout"],["progress","↗","Progress"],["coach","✦","Coach"],["profile","●","Profile"]];navEl.innerHTML=items.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}
function render(){greeting.textContent=greet()+" — let's get after it.";nav();content.innerHTML=({home,workout,progress,coach,profile}[page]());if(page==="progress")draw();if(page==="coach")renderChat()}
function home(){let m=macros(),ct=+d.profile.calTarget||2200,pt=+d.profile.pTarget||160,cbt=+d.profile.cTarget||250,ft=+d.profile.fTarget||75,t=m.p+m.c+m.f||1,p=Math.round(m.p/t*100),c=Math.round(m.c/t*100),f=100-p-c;let sched=d.scheduled[today()];return `<section>
<div class=card><div class="row between"><div><div class=eyebrow>${greet()}</div><h2 style="font-size:28px;margin:3px 0">${esc(d.profile.name||"Athlete")}</h2><div class=muted>${esc(d.profile.goal||"Personalize your profile")}</div></div><div class=avatar>${d.profile.photo?`<img class=avatar src="${d.profile.photo}">`:initials()}</div></div></div>
<div class=card><div class="row between"><h2>Today's Workout</h2><span class=pill>${sched?esc(sched.name):"Not planned"}</span></div><p class=muted>${sched?esc(sched.exercises):"Plan a workout for a specific day in the Workout tab."}</p><div class=row><button class="btn" onclick="go('workout')">Open Workout</button><button class="btn alt" onclick="openPlanner()">Plan Day</button></div></div>
<div class=card><div class="row between"><h2>Nutrition</h2><span class=pill>${m.cal} / ${ct} cal</span></div><div class=bar><i style="width:${Math.min(100,m.cal/ct*100)}%"></i></div><div class=grid style="margin-top:10px"><div class=stat>Protein<br><b>${m.p}g</b> <span class=muted>/ ${pt}g</span></div><div class=stat>Carbs<br><b>${m.c}g</b> <span class=muted>/ ${cbt}g</span></div><div class=stat>Fat<br><b>${m.f}g</b> <span class=muted>/ ${ft}g</span></div><div class=stat>Calories<br><b>${m.cal}</b></div></div>
<div class=macro style="margin-top:15px"><div class=pie style="background:conic-gradient(#5da9ff 0 ${p}%,#f39b32 ${p}% ${p+c}%,#6bd69a ${p+c}% 100%)"></div><div class=legend><div><span><i class="dot blue"></i>Protein</span><b>${p}%</b></div><div><span><i class="dot orangeDot"></i>Carbs</span><b>${c}%</b></div><div><span><i class="dot green"></i>Fat</span><b>${f}%</b></div></div></div>
<div class=row><button class="btn orange" onclick="addFood()">＋ Add Food</button><button class="btn alt" onclick="scan()">📷 Scan Barcode</button></div></div>
<div class=card><h2>Quick Nutrition</h2><div class=grid><input id=qcal class=input type=number placeholder="Calories"><input id=qp class=input type=number placeholder="Protein g"><input id=qc class=input type=number placeholder="Carbs g"><input id=qf class=input type=number placeholder="Fat g"></div><button class=btn style="margin-top:9px" onclick="quick()">Log Nutrition</button></div>
<div class=card><h2>Today's Food</h2>${foods().slice().reverse().map(x=>`<div class=exercise><b>${esc(x.name)}</b><div class=muted>${x.cal} cal · P ${x.p}g · C ${x.c}g · F ${x.f}g</div></div>`).join("")||"<div class=empty>No food logged today.</div>"}</div></section>`}
function addFood(){let n=prompt("Food name");if(!n)return;let cal=+prompt("Calories")||0,p=+prompt("Protein (g)")||0,c=+prompt("Carbs (g)")||0,f=+prompt("Fat (g)")||0;d.foods.push({name:n,cal,p,c,f,date:today()});save();render()}
function quick(){let cal=+qcal.value||0,p=+qp.value||0,c=+qc.value||0,f=+qf.value||0;if(!cal&&!p&&!c&&!f)return;d.foods.push({name:"Quick Add",cal,p,c,f,date:today()});save();render()}
function scan(){alert("Barcode scanning is ready for a food-database/API connection. V2.2 keeps the scanner entry point without guessing nutrition from a barcode.")}
function exHTML(e,i){return `<div class=exercise><button class=remove onclick="rm(${i})">×</button><input class="input en" placeholder="Exercise name" value="${esc(e.name)}"><div class=grid style="margin-top:7px"><input class="input es" type=number placeholder=Sets value="${e.sets||""}"><input class="input er" placeholder=Reps value="${esc(e.reps)}"><input class="input ew" type=number placeholder="Weight" value="${e.weight||""}"></div></div>`}
function getEx(){return [...document.querySelectorAll(".en")].map((x,i)=>({name:x.value,sets:document.querySelectorAll(".es")[i].value,reps:document.querySelectorAll(".er")[i].value,weight:document.querySelectorAll(".ew")[i].value}))}
function addEx(){let a=getEx();a.push({name:"",sets:"",reps:"",weight:""});exs.innerHTML=a.map(exHTML).join("")}
function rm(i){let a=getEx();a.splice(i,1);exs.innerHTML=a.map(exHTML).join("")}
function saveCustom(){d.custom={name:wn.value||"My Workout",exercises:getEx().filter(x=>x.name)};save();alert("Workout saved!");render()}
function log(){d.workouts.push({name:ln.value||"Workout",sets:+ls.value||0,volume:+lv.value||0,date:new Date().toLocaleDateString(),day:today()});save();render()}
function workout(){let a=d.custom?.exercises||[];let scheduled=Object.keys(d.scheduled).sort().reverse();return `<section>
<div class=card><h2>Custom Workout</h2><p class=muted>Add exercises, sets, reps and weight. Your base program stays on this device.</p><input id=wn class=input placeholder="Workout name" value="${esc(d.custom?.name)}"><div id=exs>${a.map(exHTML).join("")}</div><div class=row style="margin-top:9px"><button class="btn orange" onclick=addEx()>＋ Add Exercise</button><button class=btn onclick=saveCustom()>Save Workout</button></div></div>
<div class=card><h2>Save Workout For A Specific Day</h2><p class=muted>Choose the exact date. The workout is stored under that date and appears on Home on that day.</p><div class=form><input id=sd class=input type=date value="${editDate||today()}"><input id=sn class=input placeholder="Workout name" value="${editDate&&d.scheduled[editDate]?esc(d.scheduled[editDate].name):""}"><textarea id=sx class=input rows=5 placeholder="Bench press — 3 x 8&#10;Lat pulldown — 3 x 10">${editDate&&d.scheduled[editDate]?esc(d.scheduled[editDate].exercises):""}</textarea><button class="btn orange" onclick=saveScheduled()>SAVE WORKOUT FOR THIS DAY</button></div><div id=saveNotice class=notice>Workout saved successfully for the selected day.</div></div>
<div class=card><h2>Scheduled Workouts</h2>${scheduled.length?scheduled.map(k=>`<div class=schedule><div class="row between"><div><b>${k}</b><br>${esc(d.scheduled[k].name)}</div><div class=row><button class="btn alt small" onclick="editScheduled('${k}')">Edit</button><button class="btn danger small" onclick="deleteScheduled('${k}')">Delete</button></div></div><div class=muted>${esc(d.scheduled[k].exercises)}</div></div>`).join(""):"<div class=empty>No scheduled workouts yet.</div>"}</div>
<div class=card><h2>Log Completed Workout</h2><input id=ln class=input placeholder="Workout name"><div class=grid style="margin-top:8px"><input id=ls class=input type=number placeholder="Total sets"><input id=lv class=input type=number placeholder="Total volume"></div><button class=btn style="margin-top:9px" onclick=log()>Log Workout</button></div>
<div class=card><h2>Workout History</h2>${d.workouts.slice().reverse().map(w=>`<div class=exercise><b>${esc(w.name)}</b><div class=muted>${w.date} · ${w.sets} sets · ${w.volume} volume</div></div>`).join("")||"<div class=empty>No workouts logged yet.</div>"}</div></section>`}
function openPlanner(){page="workout";editDate=today();render();setTimeout(()=>document.getElementById("sd")?.focus(),20)}
function saveScheduled(){let k=sd.value;if(!k)return alert("Choose a date.");d.scheduled[k]={name:sn.value.trim()||"Workout",exercises:sx.value.trim()};save();editDate=null;render();setTimeout(()=>{let n=document.getElementById("saveNotice");if(n)n.style.display="block"},20)}
function editScheduled(k){editDate=k;page="workout";render()}
function deleteScheduled(k){if(confirm("Delete this scheduled workout?")){delete d.scheduled[k];save();render()}}
function progress(){return `<section>
<div class=card><div class=eyebrow>YOUR JOURNEY</div><h2 style="font-size:28px">Progress</h2><p class=muted>Visualize weight changes and training consistency from the data you save.</p></div>
<div class=card><h2>Weight Goal</h2><div class=grid><div class=stat>Start<br><b>${d.profile.weight||"—"}</b> lb</div><div class=stat>Current<br><b>${d.profile.currentWeight||d.profile.weight||"—"}</b> lb</div><div class=stat>Goal<br><b>${d.profile.goalWeight||"—"}</b> lb</div><div class=stat>Workouts<br><b>${d.workouts.length}</b></div></div><button class="btn orange" style="margin-top:9px" onclick=weigh()>＋ Log Weight</button><canvas id=chart width=700 height=220 style="margin-top:14px"></canvas></div>
<div class=card><h2>Progress Pictures</h2><p class=muted>Keep front, side, and back pictures separate so you can compare your physique over time.</p><div class=photoGrid>${["front","side","back"].map(x=>`<div><div class=photoSlot>${d.progress[x]?`<img src="${d.progress[x]}" alt="${x} progress">`:`<label>${x.toUpperCase()}<br>Tap to add</label>`}<input type=file accept="image/*" onchange="photo(event,'${x}')"></div><div class=small muted style="text-align:center;margin-top:5px">${x}</div></div>`).join("")}</div></div>
<div class=card><h2>Training Snapshot</h2><div class=grid><div class=stat>Total workouts<br><b>${d.workouts.length}</b></div><div class=stat>Total sets<br><b>${d.workouts.reduce((a,w)=>a+(+w.sets||0),0)}</b></div><div class=stat>Total volume<br><b>${d.workouts.reduce((a,w)=>a+(+w.volume||0),0)}</b></div><div class=stat>Goal<br><b>${esc(d.profile.goal||"—")}</b></div></div></div></section>`}
function weigh(){let w=+prompt("Current weight (lb)");if(!w)return;d.profile.currentWeight=w;d.weights.push({date:new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"}),weight:w});save();render()}
function draw(){let c=document.getElementById("chart");if(!c)return;let x=c.getContext("2d"),pts=d.weights;if(!pts.length){x.fillStyle="#91a4bd";x.font="16px system-ui";x.fillText("Log your first weigh-in to see your trend.",22,110);return}let v=pts.map(p=>+p.weight),mn=Math.min(...v)-2,mx=Math.max(...v)+2;if(mx===mn)mx=mn+4;x.clearRect(0,0,c.width,c.height);x.strokeStyle="#203c5d";for(let y=30;y<200;y+=40){x.beginPath();x.moveTo(25,y);x.lineTo(680,y);x.stroke()}x.strokeStyle="#5da9ff";x.lineWidth=4;x.beginPath();pts.forEach((p,i)=>{let xx=35+630*(i/Math.max(1,pts.length-1)),yy=190-(p.weight-mn)/(mx-mn)*150;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();pts.forEach((p,i)=>{let xx=35+630*(i/Math.max(1,pts.length-1)),yy=190-(p.weight-mn)/(mx-mn)*150;x.fillStyle="#f39b32";x.beginPath();x.arc(xx,yy,5,0,7);x.fill();x.fillStyle="#fff";x.font="12px system-ui";x.fillText(p.weight+" lb",xx-18,yy-10)})}
function photo(e,side){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{d.progress[side]=r.result;save();render()};r.readAsDataURL(f)}
function coach(){let name=d.coach.name||"Coach";return `<section><div class=card><div class=eyebrow>YOUR COACH</div><h2 style="font-size:28px">${esc(name)}</h2><p class=muted>Your coach can be named anything you want. This name belongs only to this user profile.</p><div class=chatbox><input id=coachName class=input value="${esc(name)}" placeholder="Name your coach"><button class="btn orange" onclick=setCoach()>SAVE</button></div></div><div id=chat></div><div class=card><div class=chatbox><input id=q class=input placeholder="Ask your coach..."><button class="btn" onclick=ask()>SEND</button></div></div></section>`}
function renderChat(){if(d.coach.chat?.length){chat.innerHTML=d.coach.chat.map(m=>`<div class="${m.who==='coach'?'coachBubble':'card'}" style="margin:10px 0">${m.who==='coach'?'<div class=coachAvatar>PG</div>':''}<div class=bubble>${m.text}</div></div>`).join("")}else addCoach("I'm your Pocket Gym coach. Ask me about today's training, progression, substitutions, or your logged progress.");}
function addCoach(text){d.coach.chat=d.coach.chat||[];d.coach.chat.push({who:"coach",text});save();chat.innerHTML+=`<div class=coachBubble style="margin:10px 0"><div class=coachAvatar>PG</div><div class=bubble>${text}</div></div>`}
function ask(){let qv=q.value.trim();if(!qv)return;d.coach.chat=d.coach.chat||[];d.coach.chat.push({who:"user",text:esc(qv)});let l=qv.toLowerCase(),a;if(l.includes("today")||l.includes("workout")){let s=d.scheduled[today()];a=s?`Today's scheduled workout is <b>${esc(s.name)}</b>. ${esc(s.exercises)}`:"You don't have a workout scheduled for today. Open Workout and choose today's date."; }else if(l.includes("progress")||l.includes("weight"))a=d.weights.length?`You've logged ${d.weights.length} weigh-ins. Your current recorded weight is <b>${d.profile.currentWeight||d.profile.weight||"not set"} lb</b>.`:"Log a weigh-in in Progress and I'll have numbers to work with.";else if(l.includes("food")||l.includes("nutrition")){let m=macros();a=`Today you've logged <b>${m.cal} calories</b>, <b>${m.p}g protein</b>, <b>${m.c}g carbs</b>, and <b>${m.f}g fat</b>.`;}else a="I can help you use your logged training, nutrition, weight, and scheduled workouts. For a real AI conversation, a secure AI/backend connection would need to be added later.";d.coach.chat.push({who:"coach",text:a});save();render()}
function setCoach(){d.coach.name=coachName.value.trim()||"Coach";save();render()}
function profile(){let p=d.profile;return `<section><div class=card><div class=row><div class=avatar>${p.photo?`<img class=avatar src="${p.photo}">`:initials()}</div><div><div class=eyebrow>PROFILE</div><h2>${esc(p.name||"Your Profile")}</h2><div class=muted>${esc(p.goal||"Personalize your training")}</div></div></div><input id=photoFile class=input style="margin-top:9px" type=file accept="image/*"></div>
<div class=card><h2>Your Details</h2><div class=form><input id=pn class=input placeholder=Name value="${esc(p.name)}"><input id=pa class=input type=number placeholder=Age value="${p.age||""}"><input id=ph class=input placeholder="Height (e.g. 5'10&quot;)" value="${esc(p.height)}"><input id=pw class=input type=number placeholder="Current weight (lb)" value="${p.weight||""}"><input id=pgw class=input type=number placeholder="Goal weight (lb)" value="${p.goalWeight||""}"><select id=pg class=input>${["Lose fat","Build muscle","Maintain","Strength","General fitness"].map(g=>`<option ${p.goal===g?"selected":""}>${g}</option>`).join("")}</select><input id=ct class=input type=number placeholder="Daily calorie target" value="${p.calTarget||""}"><input id=pt class=input type=number placeholder="Protein target (g)" value="${p.pTarget||""}"><input id=cb class=input type=number placeholder="Carb target (g)" value="${p.cTarget||""}"><input id=ft class=input type=number placeholder="Fat target (g)" value="${p.fTarget||""}"><button class=btn onclick=saveP()>Save Profile</button></div></div>
<div class=card><h2>User Data Isolation</h2><p class=muted>Each Pocket Gym profile has its own unique storage ID. Creating a new profile creates a completely separate nutrition, workout, weight, progress-photo, and coach data set on this device.</p><div class=small muted>Current profile ID: ${esc(d.id)}</div><button class="btn alt" style="margin-top:9px" onclick=newUser()>＋ Create New User Profile</button></div></section>`}
function saveP(){Object.assign(d.profile,{name:pn.value,age:pa.value,height:ph.value,weight:pw.value,goalWeight:pgw.value,goal:pg.value,calTarget:ct.value,pTarget:pt.value,cTarget:cb.value,fTarget:ft.value});let f=photoFile.files?.[0];if(f){let r=new FileReader();r.onload=()=>{d.profile.photo=r.result;save();render()};r.readAsDataURL(f)}else{save();render()}}
function newUser(){if(!confirm("Create a new separate Pocket Gym user profile? The current user's data will remain saved."))return;d=blank();page="home";save();render()}
const navEl=document.getElementById("nav");render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
