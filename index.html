<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152b"><link rel="manifest" href="./manifest.json">
<title>Your Pocket Gym V2.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050b16;color:#eef5ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(#07152b,#050b16 42%);padding-bottom:82px}
header{padding:25px 17px 10px}.eyebrow{font-size:11px;letter-spacing:2px;color:#63a8ff;font-weight:800}.title{font-size:32px;font-weight:950;color:#f39b32;margin:3px 0}.muted{color:#91a4bd;font-size:13px}main{padding:0 15px}.card{background:#0b1830;border:1px solid #183153;border-radius:18px;padding:16px;margin:12px 0}.card h2{margin:0 0 11px;font-size:20px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#071225;border-radius:13px;padding:12px}.stat b{font-size:20px}.btn{border:0;border-radius:11px;padding:11px 13px;background:#1267d9;color:#fff;font-weight:800}.btn.orange{background:#e98421}.btn.alt{background:#182942}.input{width:100%;background:#071225;color:#fff;border:1px solid #254364;border-radius:10px;padding:11px}.form{display:grid;gap:9px}.avatar{width:62px;height:62px;border-radius:50%;object-fit:cover;background:#1267d9;display:grid;place-items:center;font-weight:900;font-size:20px;border:2px solid #347edb}.bar{height:9px;background:#071225;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#f39b32;border-radius:99px}.macro{display:grid;grid-template-columns:145px 1fr;gap:18px;align-items:center}.pie{width:140px;height:140px;border-radius:50%;position:relative}.pie:after{content:"";position:absolute;inset:27px;border-radius:50%;background:#0b1830}.legend div{display:flex;justify-content:space-between;margin:8px 0}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}.blue{background:#5da9ff}.orangeDot{background:#f39b32}.green{background:#6bd69a}.exercise{padding:11px;border:1px solid #1c3658;border-radius:13px;margin:8px 0;background:#071225}.remove{float:right;background:none;border:0;color:#f77;font-size:19px}.nav{position:fixed;bottom:0;left:0;right:0;background:#061124ee;backdrop-filter:blur(14px);border-top:1px solid #173050;display:flex;justify-content:center;z-index:5}.nav button{flex:1;max-width:150px;background:none;border:0;color:#7890ac;padding:10px 4px;font-size:11px}.nav button.active{color:#66aaff}.pill{padding:5px 9px;background:#12294a;border-radius:99px;color:#8fc2ff;font-size:12px}canvas{width:100%;height:220px;background:#071225;border-radius:14px}.empty{text-align:center;padding:25px;color:#91a4bd}@media(max-width:520px){.macro{grid-template-columns:1fr}.pie{margin:auto}}
</style></head><body><div class="app"><header><div class="eyebrow">YOUR POCKET GYM</div><div class="title">V2.1</div><div id="greeting" class="muted"></div></header><main id="content"></main><nav class="nav"><button data-p="home">⌂<br>Home</button><button data-p="workout">🏋<br>Workout</button><button data-p="progress">↗<br>Progress</button><button data-p="profile">●<br>Profile</button></nav></div>
<script>
const K="ypg_v21",blank={profile:{},foods:[],workouts:[],custom:null,weights:[]};let d=JSON.parse(localStorage.getItem(K)||"null")||blank,page="home";function save(){localStorage.setItem(K,JSON.stringify(d))}function day(){return new Date().toISOString().slice(0,10)}function greet(){let h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening"}function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function initials(){return(d.profile.name||"YG").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}function foods(){return d.foods.filter(x=>x.date===day())}function macros(){return foods().reduce((a,x)=>(a.cal+=+x.cal||0,a.p+=+x.p||0,a.c+=+x.c||0,a.f+=+x.f||0,a),{cal:0,p:0,c:0,f:0})}
function home(){let m=macros(),ct=+d.profile.calTarget||2200,pt=+d.profile.pTarget||160,carbt=+d.profile.cTarget||250,ft=+d.profile.fTarget||75,t=m.p+m.c+m.f||1,p=Math.round(m.p/t*100),c=Math.round(m.c/t*100),f=100-p-c;return `<section><div class=card><div class="row between"><div><div class=eyebrow>${greet()}</div><h2 style="font-size:28px;margin:3px 0">${esc(d.profile.name||"Athlete")}</h2><div class=muted>${esc(d.profile.goal||"Personalize your profile")}</div></div><div class=avatar>${d.profile.photo?`<img class=avatar src="${d.profile.photo}">`:initials()}</div></div></div>
<div class=card><div class="row between"><h2>Today's Workout</h2><span class=pill>${d.workouts.length} logged</span></div><p class=muted>Log today's training and build your history.</p><button class=btn onclick="go('workout')">Open Workout</button></div>
<div class=card><div class="row between"><h2>Nutrition</h2><span class=pill>${m.cal} / ${ct} cal</span></div><div class=bar><i style="width:${Math.min(100,m.cal/ct*100)}%"></i></div><div class=grid style="margin-top:10px"><div class=stat>Protein<br><b>${m.p}g</b> <span class=muted>/ ${pt}g</span></div><div class=stat>Carbs<br><b>${m.c}g</b> <span class=muted>/ ${carbt}g</span></div><div class=stat>Fat<br><b>${m.f}g</b> <span class=muted>/ ${ft}g</span></div><div class=stat>Calories<br><b>${m.cal}</b></div></div>
<div class=macro style="margin-top:15px"><div class=pie style="background:conic-gradient(#5da9ff 0 ${p}%,#f39b32 ${p}% ${p+c}%,#6bd69a ${p+c}% 100%)"></div><div class=legend><div><span><i class="dot blue"></i>Protein</span><b>${p}%</b></div><div><span><i class="dot orangeDot"></i>Carbs</span><b>${c}%</b></div><div><span><i class="dot green"></i>Fat</span><b>${f}%</b></div></div></div>
<div class=row><button class="btn orange" onclick="addFood()">＋ Add Food</button><button class="btn alt" onclick="scan()">📷 Scan Barcode</button></div></div>
<div class=card><h2>Quick Nutrition</h2><div class=grid><input id=qcal class=input type=number placeholder="Calories"><input id=qp class=input type=number placeholder="Protein g"><input id=qc class=input type=number placeholder="Carbs g"><input id=qf class=input type=number placeholder="Fat g"></div><button class=btn style="margin-top:9px" onclick="quick()">Log Nutrition</button></div>
<div class=card><h2>Today's Food</h2>${foods().slice().reverse().map(x=>`<div class=exercise><b>${esc(x.name)}</b><div class=muted>${x.cal} cal · P ${x.p}g · C ${x.c}g · F ${x.f}g</div></div>`).join("")||"<div class=empty>No food logged today.</div>"}</div></section>`}
function addFood(){let n=prompt("Food name");if(!n)return;let cal=+prompt("Calories")||0,p=+prompt("Protein (g)")||0,c=+prompt("Carbs (g)")||0,f=+prompt("Fat (g)")||0;d.foods.push({name:n,cal,p,c,f,date:day()});save();render()}function quick(){let cal=+qcal.value||0,p=+qp.value||0,c=+qc.value||0,f=+qf.value||0;if(!cal&&!p&&!c&&!f)return;d.foods.push({name:"Quick Add",cal,p,c,f,date:day()});save();render()}function scan(){alert("Barcode scanning is included in the V2.1 design. To return accurate product nutrition, the camera scanner needs to be connected to a food database/API next; the app will not guess nutrition from a barcode.")}function go(x){page=x;render();scrollTo(0,0)}
function exHTML(e,i){return `<div class=exercise><button class=remove onclick="rm(${i})">×</button><input class="input en" placeholder="Exercise name" value="${esc(e.name)}"><div class=grid style="margin-top:7px"><input class="input es" type=number placeholder=Sets value="${e.sets||""}"><input class="input er placeholder" placeholder=Reps value="${esc(e.reps)}"><input class="input ew" type=number placeholder="Weight" value="${e.weight||""}"></div></div>`}
function getEx(){return [...document.querySelectorAll(".en")].map((x,i)=>({name:x.value,sets:document.querySelectorAll(".es")[i].value,reps:document.querySelectorAll(".er")[i].value,weight:document.querySelectorAll(".ew")[i].value}))}function addEx(){let a=getEx();a.push({name:"",sets:"",reps:"",weight:""});document.getElementById("exs").innerHTML=a.map(exHTML).join("")}function rm(i){let a=getEx();a.splice(i,1);document.getElementById("exs").innerHTML=a.map(exHTML).join("")}function saveCustom(){d.custom={name:wn.value||"My Workout",exercises:getEx().filter(x=>x.name)};save();alert("Workout saved!");render()}function log(){d.workouts.push({name:ln.value||"Workout",sets:+ls.value||0,volume:+lv.value||0,date:new Date().toLocaleDateString()});save();render()}
function workout(){let a=d.custom?.exercises||[];return `<section><div class=card><h2>Custom Workout</h2><p class=muted>Add exercises, sets, reps and weight. Your program stays on this device.</p><input id=wn class=input placeholder="Workout name" value="${esc(d.custom?.name)}"><div id=exs>${a.map(exHTML).join("")}</div><button class="btn orange" onclick=addEx()>＋ Add Exercise</button> <button class=btn onclick=saveCustom()>Save Workout</button></div><div class=card><h2>Log Completed Workout</h2><input id=ln class=input placeholder="Workout name"><div class=grid style="margin-top:8px"><input id=ls class=input type=number placeholder="Total sets"><input id=lv class=input type=number placeholder="Total volume"></div><button class=btn style="margin-top:9px" onclick=log()>Log Workout</button></div><div class=card><h2>Workout History</h2>${d.workouts.slice().reverse().map(w=>`<div class=exercise><b>${esc(w.name)}</b><div class=muted>${w.date} · ${w.sets} sets · ${w.volume} volume</div></div>`).join("")||"<div class=empty>No workouts logged yet.</div>"}</div></section>`}
function progress(){return `<section><div class=card><div class=eyebrow>YOUR JOURNEY</div><h2 style="font-size:28px">Progress</h2><p class=muted>Visualize weight changes and training consistency from the data you save.</p></div><div class=card><h2>Weight Goal</h2><div class=grid><div class=stat>Start<br><b>${d.profile.weight||"—"}</b> lb</div><div class=stat>Current<br><b>${d.profile.currentWeight||d.profile.weight||"—"}</b> lb</div><div class=stat>Goal<br><b>${d.profile.goalWeight||"—"}</b> lb</div><div class=stat>Workouts<br><b>${d.workouts.length}</b></div></div><button class="btn orange" style="margin-top:9px" onclick=weigh()>＋ Log Weight</button><canvas id=chart width=700 height=220 style="margin-top:14px"></canvas></div><div class=card><h2>Training Snapshot</h2><div class=grid><div class=stat>Total workouts<br><b>${d.workouts.length}</b></div><div class=stat>Total sets<br><b>${d.workouts.reduce((a,w)=>a+(+w.sets||0),0)}</b></div><div class=stat>Total volume<br><b>${d.workouts.reduce((a,w)=>a+(+w.volume||0),0)}</b></div><div class=stat>Goal<br><b>${esc(d.profile.goal||"—")}</b></div></div></div></section>`}
function weigh(){let w=+prompt("Current weight (lb)");if(!w)return;d.profile.currentWeight=w;d.weights.push({date:new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"}),weight:w});save();render()}function draw(){let c=document.getElementById("chart");if(!c)return;let x=c.getContext("2d"),pts=d.weights;if(!pts.length){x.fillStyle="#91a4bd";x.font="16px system-ui";x.fillText("Log your first weigh-in to see your trend.",22,110);return}let v=pts.map(p=>+p.weight),mn=Math.min(...v)-2,mx=Math.max(...v)+2;x.clearRect(0,0,c.width,c.height);x.strokeStyle="#203c5d";for(let y=30;y<200;y+=40){x.beginPath();x.moveTo(25,y);x.lineTo(680,y);x.stroke()}x.strokeStyle="#5da9ff";x.lineWidth=4;x.beginPath();pts.forEach((p,i)=>{let xx=35+630*(i/Math.max(1,pts.length-1)),yy=190-(p.weight-mn)/(mx-mn)*150;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();pts.forEach((p,i)=>{let xx=35+630*(i/Math.max(1,pts.length-1)),yy=190-(p.weight-mn)/(mx-mn)*150;x.fillStyle="#f39b32";x.beginPath();x.arc(xx,yy,5,0,7);x.fill();x.fillStyle="#fff";x.font="12px system-ui";x.fillText(p.weight+" lb",xx-18,yy-10)})}
function profile(){let p=d.profile;return `<section><div class=card><div class=row><div class=avatar>${p.photo?`<img class=avatar src="${p.photo}">`:initials()}</div><div><div class=eyebrow>PROFILE</div><h2>${esc(p.name||"Your Profile")}</h2><div class=muted>${esc(p.goal||"Personalize your training")}</div></div></div><input id=photo class=input style="margin-top:9px" type=file accept="image/*"></div><div class=card><h2>Your Details</h2><div class=form><input id=pn class=input placeholder=Name value="${esc(p.name)}"><input id=pa class=input type=number placeholder=Age value="${p.age||""}"><input id=ph class=input placeholder="Height (e.g. 5'10&quot;)" value="${esc(p.height)}"><input id=pw class=input type=number placeholder="Current weight (lb)" value="${p.weight||""}"><input id=pgw class=input type=number placeholder="Goal weight (lb)" value="${p.goalWeight||""}"><select id=pg class=input>${["Lose fat","Build muscle","Maintain","Strength","General fitness"].map(g=>`<option ${p.goal===g?"selected":""}>${g}</option>`).join("")}</select><input id=ct class=input type=number placeholder="Daily calorie target" value="${p.calTarget||""}"><input id=pt class=input type=number placeholder="Protein target (g)" value="${p.pTarget||""}"><input id=cb class=input type=number placeholder="Carb target (g)" value="${p.cTarget||""}"><input id=ft class=input type=number placeholder="Fat target (g)" value="${p.fTarget||""}"><button class=btn onclick=saveP()>Save Profile</button></div></div></section>`}
function saveP(){Object.assign(d.profile,{name:pn.value,age:pa.value,height:ph.value,weight:pw.value,goalWeight:pgw.value,goal:pg.value,calTarget:ct.value,pTarget:pt.value,cTarget:cb.value,fTarget:ft.value});let f=photo.files[0];if(f){let r=new FileReader;r.onload=()=>{d.profile.photo=r.result;save();render()};r.readAsDataURL(f)}else{save();render()}}
function render(){greeting.textContent=greet()+" — let's get after it.";content.innerHTML=page==="home"?home():page==="workout"?workout():page==="progress"?progress():profile();document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===page));if(page==="progress")draw()}document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.p));render();
</script></body></html>
