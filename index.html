<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Your Pocket Gym</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.head{background:#fff;border-bottom:1px solid #e5e7eb;padding:20px 16px 14px;position:sticky;top:0;z-index:5}.head h1{margin:0;font-size:24px}.head p{margin:4px 0 0;color:#6b7280;font-size:13px}
main{padding:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:14px}.card h2{margin:0 0 12px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f8fafc;border-radius:12px;padding:13px}.stat b{display:block;font-size:21px}.muted{color:#6b7280;font-size:13px}
label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;font:inherit;background:#fff}button{border:0;border-radius:10px;padding:11px 14px;background:#111827;color:#fff;font:inherit;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#b91c1c}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.list{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.empty{text-align:center;color:#6b7280;padding:18px}.notice{display:none;background:#ecfdf5;color:#065f46;padding:10px;border-radius:10px;font-size:13px;margin:10px 0}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;z-index:10}.tabs button{flex:1;max-width:126px;background:#fff;color:#6b7280;border-radius:0;padding:8px 2px;font-size:11px}.tabs button.active{color:#111827;font-weight:700}.tabs span{display:block;font-size:18px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo{aspect-ratio:3/4;border:2px dashed #cbd5e1;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#f8fafc}.photo img{width:100%;height:100%;object-fit:cover}.photo span{font-size:12px;color:#64748b;text-align:center}.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}.coach{background:#111827;color:white}.coach .muted{color:#cbd5e1}.small{font-size:11px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=> {
const KEY="YOUR_POCKET_GYM_V22_DATA";
let tab="home";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const makeId=()=>Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);
function fresh(){return{user:{id:makeId(),name:"",weight:"",goal:"",coach:"Coach"},nutrition:{},workouts:{},progress:{front:null,side:null,back:null}}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&x.user&&x.nutrition&&x.workouts&&x.progress)return x}catch(e){}return fresh()}
let s=load();
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function day(){const k=today();if(!s.nutrition[k])s.nutrition[k]={foods:[],calories:0,protein:0,carbs:0,fat:0};return s.nutrition[k]}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function nav(){return '<nav class="tabs">'+[['home','⌂','Home'],['workout','🏋','Workout'],['nutrition','🥗','Nutrition'],['progress','●','Progress'],['coach','🤖','Coach'],['profile','◉','Profile']].map(a=>'<button class="'+(tab===a[0]?'active':'')+'" onclick="PG.go(\''+a[0]+'\')"><span>'+a[1]+'</span>'+a[2]+'</button>').join('')+'</nav>'}
function page(body){document.getElementById("app").innerHTML='<header class="head"><h1>Your Pocket Gym</h1><p>'+(s.user.name?'Welcome back, '+esc(s.user.name):'Your personal fitness dashboard')+'</p></header><main>'+body+'</main>'+nav()}
function home(){const d=day();const upcoming=Object.keys(s.workouts).filter(k=>k>=today()).length;return '<section class="card"><h2>Today</h2><div class="grid"><div class="stat"><b>'+d.calories+'</b><span class="muted">Calories</span></div><div class="stat"><b>'+d.protein+'g</b><span class="muted">Protein</span></div><div class="stat"><b>'+upcoming+'</b><span class="muted">Upcoming workouts</span></div><div class="stat"><b>'+esc(s.user.weight||"—")+'</b><span class="muted">Current weight</span></div></div></section><section class="card"><h2>Quick actions</h2><div class="row"><button onclick="PG.go(\'nutrition\')">Log food</button><button onclick="PG.go(\'workout\')">Plan workout</button><button onclick="PG.go(\'progress\')">Progress</button></div></section><section class="card"><h2>Today\'s workout</h2>'+(s.workouts[today()]?'<b>'+esc(s.workouts[today()].name)+'</b><p class="muted">'+esc(s.workouts[today()].exercises)+'</p>':'<div class="empty">No workout planned for today.</div>')+'</section>'}
function nutrition(){const d=day();return '<section class="card"><h2>Nutrition — '+today()+'</h2><div class="grid"><div class="stat"><b>'+d.calories+'</b><span class="muted">Calories</span></div><div class="stat"><b>'+d.protein+'g</b><span class="muted">Protein</span></div><div class="stat"><b>'+d.carbs+'g</b><span class="muted">Carbs</span></div><div class="stat"><b>'+d.fat+'g</b><span class="muted">Fat</span></div></div></section><section class="card"><h2>Add food</h2><label>Food</label><input id="fn" placeholder="Chicken tacos"><div class="grid"><div><label>Calories</label><input id="fc" type="number" min="0"></div><div><label>Protein</label><input id="fp" type="number" min="0"></div><div><label>Carbs</label><input id="fcb" type="number" min="0"></div><div><label>Fat</label><input id="ff" type="number" min="0"></div></div><br><button onclick="PG.addFood()">Add food</button></section><section class="card"><h2>Today\'s foods</h2>'+(d.foods.length?d.foods.map((f,i)=>'<div class="list"><span>'+esc(f.name)+'<br><span class="muted">'+f.cal+' cal · '+f.pro+'g protein</span></span><button class="danger" onclick="PG.removeFood('+i+')">Delete</button></div>').join(''):'<div class="empty">Nothing logged today.</div>')+'</section>'}
function workout(){const ks=Object.keys(s.workouts).sort();return '<section class="card"><h2>Plan a workout</h2><label>Specific day</label><input id="wd" type="date" value="'+today()+'"><label>Workout name</label><input id="wn" placeholder="Push Day"><label>Exercises</label><textarea id="we" rows="6" placeholder="Bench press — 3 x 8"></textarea><div id="notice" class="notice">Workout saved successfully.</div><br><button onclick="PG.saveWorkout()">Save Workout</button></section><section class="card"><h2>Scheduled workouts</h2>'+(ks.length?ks.map(k=>'<div class="list"><span><b>'+k+'</b><br>'+esc(s.workouts[k].name)+'</span><div class="row"><button class="secondary" onclick="PG.edit(\''+k+'\')">Edit</button><button class="danger" onclick="PG.del(\''+k+'\')">Delete</button></div></div>').join(''):'<div class="empty">No workouts scheduled.</div>')+'</section>'}
function progress(){return '<section class="card"><h2>Progress</h2><div class="grid"><div class="stat"><b>'+esc(s.user.weight||"—")+'</b><span class="muted">Current weight</span></div><div class="stat"><b>'+Object.keys(s.workouts).length+'</b><span class="muted">Scheduled workouts</span></div></div></section><section class="card"><h2>Progress Pictures</h2><p class="muted">Front, side, and back are separate.</p><div class="photos">'+['front','side','back'].map(p=>'<div><div class="photo">'+(s.progress[p]?'<img src="'+s.progress[p]+'" alt="'+p+' progress">':'<span>'+p.toUpperCase()+'<br>Tap to add</span>')+'<input type="file" accept="image/*" onchange="PG.photo(event,\''+p+'\')"></div><div class="muted" style="text-align:center">'+p+'</div></div>').join('')+'</div></section>'}
function coach(){return '<section class="card coach"><h2>Coach: '+esc(s.user.coach||"Coach")+'</h2><p class="muted">Name your coach whatever you want.</p><label style="color:white">Coach name</label><input id="cn" value="'+esc(s.user.coach||"Coach")+'"><br><br><button onclick="PG.coach()">Save coach name</button></section><section class="card"><h2>Coach snapshot</h2><p><b>Goal:</b> '+(esc(s.user.goal)||"Not set")+'</p><p><b>Weight:</b> '+(esc(s.user.weight)||"Not set")+'</p><p><b>Planned workouts:</b> '+Object.keys(s.workouts).length+'</p><p><b>Today\'s calories:</b> '+day().calories+'</p></section>'}
function profile(){return '<section class="card"><h2>Profile</h2><label>Name</label><input id="pn" value="'+esc(s.user.name)+'"><label>Current weight</label><input id="pw" value="'+esc(s.user.weight)+'"><label>Goal</label><input id="pg" value="'+esc(s.user.goal)+'"><br><br><button onclick="PG.profile()">Save Profile</button></section><section class="card"><h2>Your Pocket Gym data</h2><p class="muted">This build keeps this user\'s Pocket Gym data in a dedicated browser storage record.</p></section>'}
function render(){page({home,nutrition,workout,progress,coach,profile}[tab]())}
window.PG={
go:t=>{tab=t;render()},
addFood:()=>{const d=day(),f={name:fn.value.trim()||"Food",cal:+fc.value||0,pro:+fp.value||0,carb:+fcb.value||0,fat:+ff.value||0};d.foods.push(f);d.calories+=f.cal;d.protein+=f.pro;d.carbs+=f.carb;d.fat+=f.fat;save();render()},
removeFood:i=>{const d=day(),f=d.foods[i];if(!f)return;d.calories-=f.cal;d.protein-=f.pro;d.carbs-=f.carb;d.fat-=f.fat;d.foods.splice(i,1);save();render()},
saveWorkout:()=>{const k=wd.value;if(!k){alert("Choose a day first.");return}s.workouts[k]={name:wn.value.trim()||"Workout",exercises:we.value.trim()};save();render();setTimeout(()=>{const n=document.getElementById("notice");if(n)n.style.display="block"},30)},
edit:k=>{const w=s.workouts[k];tab="workout";render();setTimeout(()=>{wd.value=k;wn.value=w.name;we.value=w.exercises},30)},
del:k=>{if(confirm("Delete this workout?")){delete s.workouts[k];save();render()}},
photo:(e,p)=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{s.progress[p]=r.result;save();render()};r.readAsDataURL(f)},
coach:()=>{s.user.coach=cn.value.trim()||"Coach";save();render()},
profile:()=>{s.user.name=pn.value.trim();s.user.weight=pw.value.trim();s.user.goal=pg.value.trim();save();render()}
};
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
